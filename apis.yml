aid: sanlo
name: Sanlo
description: 'Sanlo is a multi-platform payments and monetization platform built specifically
  for game developers and studios. Its products let studios run live ops and accept
  payments outside the walled gardens of the major app stores to reduce platform commission
  fees: Webshop Builder (a full-stack direct-to-consumer web shop), Web Checkout (accept
  payments on any website, web shop, or web game), and Unity Checkout (native iOS/Android
  in-game checkout for Unity titles via a first-party SDK and API, with one-click checkout,
  fully customizable UI, and creator-code support). Card and payment collection is
  powered by Adyen underneath. Sanlo also offers game funding to help studios finance
  user acquisition and growth. The company is backed by Index Ventures and other gaming-focused
  investors.'
